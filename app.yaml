runtime: nodejs24

# One service does both jobs:
#   /api/* and /health → the Express server (server.js, started by `npm start`)
#   everything else    → the static Vite build in dist/
# Because the API shares the site's origin, the browser needs no API URL and
# no CORS configuration.
#
# Server secrets live in env_variables.yaml, which is NOT in git.
# Create it with:  npm run deploy:env
includes:
  - env_variables.yaml

handlers:
  - url: /api/.*
    script: auto
    secure: always

  - url: /health
    script: auto
    secure: always

  # App shell. no-cache so a deploy shows up on the next load; the hashed
  # files it points to under assets/ are safe to cache.
  - url: /
    static_files: dist/index.html
    upload: dist/index.html
    secure: always
    http_headers:
      Cache-Control: no-cache

  # Client-side routes handled by the React app
  - url: /(admin|leaderboard|test)/?
    static_files: dist/index.html
    upload: dist/index.html
    secure: always
    http_headers:
      Cache-Control: no-cache

  # Built assets
  - url: /(.*)
    static_files: dist/\1
    upload: dist/(.*)
    secure: always
